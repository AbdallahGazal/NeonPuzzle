<div class="min-h-screen bg-[#0d0d0f] text-white p-4 md:p-10 font-sans">

  <header class="flex justify-between items-center mb-10 w-full max-w-5xl mx-auto">
    <h1 class="text-xl md:text-2xl font-bold text-[#e056fd] tracking-widest drop-shadow-[0_0_12px_rgba(224,86,253,0.7)]">
      NEON PUZZLE
    </h1>
    <div class="flex gap-6 text-gray-500">
      <button (click)="startNewGame()" class="hover:text-[#00e5ff] transition-all cursor-pointer">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
      </button>
      <button class="hover:text-white transition-all cursor-pointer">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
      </button>
    </div>
  </header>

  <main class="w-full max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-[1fr_360px] gap-10 items-start">

    <div class="flex flex-col gap-6">
      <div class="relative aspect-square bg-[#1a1a1e] p-1 rounded-sm shadow-[0_0_40px_-10px_rgba(224,86,253,0.3)] border border-[#e056fd]/20">
        <div class="grid grid-cols-3 grid-rows-3 w-full h-full gap-0.5 bg-black">
          @for (tile of tiles(); track $index) {
            <div
              (click)="moveTile($index)"
              class="w-full h-full transition-all duration-200 ease-out"
              [ngClass]="{
                'bg-[#0d0d0f]': tile === 0,
                'cursor-pointer hover:brightness-125 hover:scale-[0.98] active:scale-95': tile !== 0
              }"
              [ngStyle]="getTileStyle(tile)">
            </div>
          }
        </div>
      </div>

      <div class="flex flex-col gap-3">
        <button (click)="solveWithAI()" [disabled]="isSolving()" class="group w-full bg-[#e056fd] hover:bg-[#c939e6] disabled:opacity-50 disabled:cursor-not-allowed text-black font-extrabold py-4 rounded-sm flex justify-center items-center gap-3 transition-all shadow-[0_4px_20px_rgba(224,86,253,0.4)]">
          <svg class="w-5 h-5" [ngClass]="{'animate-spin': isSolving()}" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2a2 2 0 012 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 017 7h1a1 1 0 011 1v3a1 1 0 01-1 1h-1v1a2 2 0 01-2 2H5a2 2 0 01-2-2v-1H2a1 1 0 01-1-1v-3a1 1 0 011-1h1a7 7 0 017-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 012-2M7.5 13A2.5 2.5 0 005 15.5A2.5 2.5 0 007.5 18a2.5 2.5 0 002.5-2.5A2.5 2.5 0 007.5 13m9 0a2.5 2.5 0 00-2.5 2.5a2.5 2.5 0 002.5 2.5a2.5 2.5 0 002.5-2.5a2.5 2.5 0 00-2.5-2.5z"></path></svg>
          {{ isSolving() ? 'SOLVING...' : 'SOLVE WITH A* ALGORITHM' }}
        </button>

        <div class="grid grid-cols-2 gap-3">
          <button (click)="solveWithBFS()" [disabled]="isSolving()" class="group bg-[#00e5ff] hover:bg-[#00b8cc] disabled:opacity-50 disabled:cursor-not-allowed text-black font-extrabold py-4 rounded-sm flex justify-center items-center gap-2 transition-all shadow-[0_4px_20px_rgba(0,229,255,0.3)] text-xs md:text-sm">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71L12 2z"/></svg>
            BFS
          </button>

          <button (click)="solveWithGreedy()" [disabled]="isSolving()" class="group bg-[#ccff00] hover:bg-[#aacc00] disabled:opacity-50 disabled:cursor-not-allowed text-black font-extrabold py-4 rounded-sm flex justify-center items-center gap-2 transition-all shadow-[0_4px_20px_rgba(204,255,0,0.3)] text-xs md:text-sm">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M11.5 2C6.81 2 3 5.81 3 10.5S6.81 19 11.5 19h.5v3l5-4-5-4v3h-.5C8.46 17 6 14.54 6 11.5S8.46 6 11.5 6 17 8.46 17 11.5c0 1.64-.71 3.12-1.84 4.16l1.42 1.42C18.17 15.58 19 13.64 19 11.5 19 7.36 15.64 4 11.5 4V2z"/></svg>
            GREEDY
          </button>
        </div>
      </div>

    </div>

    <aside class="bg-[#16161a] p-8 rounded-lg border border-gray-800/40">
      <h2 class="text-[#00e5ff] text-[10px] font-bold tracking-[0.2em] uppercase mb-6 opacity-80">Current Session</h2>

      <div class="grid grid-cols-2 gap-4 mb-10">
        <div class="bg-[#1f1f23] p-5 rounded border border-gray-700/30">
          <p class="text-gray-500 text-[9px] font-bold uppercase tracking-widest mb-1">Moves</p>
          <p class="text-3xl font-mono font-bold">{{ moves() }}</p>
        </div>
        <div class="bg-[#1f1f23] p-5 rounded border border-gray-700/30">
          <p class="text-gray-500 text-[9px] font-bold uppercase tracking-widest mb-1">Time</p>
          <p class="text-3xl font-mono font-bold">{{ timerDisplay() }}</p>
        </div>
      </div>

      <h2 class="text-gray-500 text-[10px] font-bold tracking-[0.2em] uppercase mb-4 opacity-80">Target Image</h2>
      <div class="w-full rounded-sm overflow-hidden border border-gray-800 group relative">
        <img [src]="imageUrl" alt="Target" class=" object-cover opacity-60 group-hover:opacity-100 transition-opacity duration-500">
      </div>
    </aside>

  </main>
</div>
